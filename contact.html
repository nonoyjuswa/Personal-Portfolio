<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Rubik:wght@700;800&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #1c0d10;
    --bg-mid: #2c1216;
    --accent: #e8735f;
    --accent-dim: #7a3730;
    --text-light: #f3e9e6;
    --text-muted: #cbb7b3;
    --line: rgba(243, 233, 230, 0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(120% 160% at 10% 10%, var(--bg-mid) 0%, var(--bg-deep) 60%);
    color: var(--text-light);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .panel {
    width: 100%;
    max-width: 1100px;
    border-radius: 10px;
    background: linear-gradient(160deg, #241012, #180b0c);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    display: grid;
    grid-template-columns: 1.15fr 1.3fr 1fr;
    padding: 2.6rem 2.8rem;
    gap: 2.4rem;
  }

  .col {
    position: relative;
    padding-right: 2.4rem;
  }

  .col:not(:last-child)::after {
    content: "";
    position: absolute;
    top: 4px;
    bottom: 4px;
    right: 0;
    width: 1px;
    background: var(--line);
  }

  h2 {
    font-family: 'Rubik', sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: 0.03em;
    margin-bottom: 0.7rem;
  }

  .col-collab p {
    font-size: 0.86rem;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 1.3rem;
    max-width: 30ch;
  }

  .info-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .info-list li {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-size: 0.85rem;
    color: var(--text-light);
  }

  .info-list .icon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: rgba(232,115,95,0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .info-list svg {
    width: 13px;
    height: 13px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.8;
  }

  /* Scan to connect column */
  .qr-row {
    display: flex;
    gap: 1.6rem;
    margin-top: 1.1rem;
  }

  .qr-item {
    text-align: center;
  }

  .qr-frame {
    width: 108px;
    height: 108px;
    background: #f3e9e2;
    border-radius: 6px;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .qr-frame img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .qr-badge {
    position: absolute;
    width: 22px;
    height: 22px;
    background: #1c0d10;
    color: var(--text-light);
    border-radius: 5px;
    font-size: 0.55rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.02em;
  }

  .qr-label {
    margin-top: 0.6rem;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* Right column */
  .col-tagline {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    text-align: right;
    padding-right: 0;
  }

  .spark {
    width: 34px;
    height: 34px;
    margin-bottom: 1.4rem;
    align-self: center;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.35rem;
    line-height: 1.55;
    color: var(--text-light);
    letter-spacing: 0.02em;
  }

  .signature {
    margin-top: 1.4rem;
    width: 110px;
    opacity: 0.85;
  }

  @media (max-width: 820px) {
    .panel {
      grid-template-columns: 1fr;
      padding: 2rem;
    }
    .col { padding-right: 0; padding-bottom: 2rem; }
    .col:not(:last-child)::after {
      top: auto;
      bottom: 0;
      left: 0;
      right: 0;
      width: auto;
      height: 1px;
    }
    .col-tagline { align-items: center; text-align: center; }
    .spark { align-self: center; }
  }
</style>
</head>
<body>

  <div class="panel">

    <div class="col col-collab">
      <h2>Let's Collaborate</h2>
      <p>Have a project in mind or just want to say hi? I'd love to hear from you.</p>

      <ul class="info-list">
        <li>
          <span class="icon">
            <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="M3 6l9 7 9-7"/></svg>
          </span>
          hello@yourname.com
        </li>
        <li>
          <span class="icon">
            <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.9 2.2z"/></svg>
          </span>
          +91 00000 00000
        </li>
        <li>
          <span class="icon">
            <svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
          </span>
          Your City, Country
        </li>
        <li>
          <span class="icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a13 13 0 0 1 0 18 13 13 0 0 1 0-18z"/></svg>
          </span>
          yourname.com
        </li>
      </ul>
    </div>

    <div class="col col-qr">
      <h2>Scan to Connect</h2>
      <div class="qr-row">
        <div class="qr-item">
          <div class="qr-frame">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&bgcolor=f3e9e2&color=1c0d10&data=https://linkedin.com/in/yourname" alt="LinkedIn QR code">
            <div class="qr-badge">in</div>
          </div>
          <div class="qr-label">LinkedIn</div>
        </div>
        <div class="qr-item">
          <div class="qr-frame">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&bgcolor=f3e9e2&color=1c0d10&data=https://behance.net/yourname" alt="Behance QR code">
            <div class="qr-badge">Be</div>
          </div>
          <div class="qr-label">Behance</div>
        </div>
      </div>
    </div>

    <div class="col col-tagline">
      <svg class="spark" viewBox="0 0 40 40" fill="none">
        <path d="M20 2 L23 17 L38 20 L23 23 L20 38 L17 23 L2 20 L17 17 Z" fill="var(--accent)" opacity="0.9"/>
      </svg>
      <p class="tagline">Designing<br>experiences.<br>Building<br>connections.</p>
      <svg class="signature" viewBox="0 0 140 50" fill="none">
        <path d="M5 35 Q15 10 25 30 T45 20 Q55 8 60 30 T85 15 Q95 5 100 28 T130 18" stroke="var(--text-muted)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

  </div>

</body>
</html>
